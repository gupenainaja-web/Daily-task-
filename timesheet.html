<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตารางเวลาเข้างาน</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1C2127;
    --ink-soft:#3A4048;
    --paper:#FAF8F3;
    --paper-2:#F1EEE5;
    --line:#DAD5C7;
    --brass:#B8823D;
    --brass-dark:#8A5F27;
    --teal:#2F6F62;
    --teal-light:#E4EFEC;
    --red:#B14B3F;
    --red-light:#F6E7E4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Sarabun',sans-serif;
    color:var(--ink);
    padding:24px 20px 60px;
  }
  .wrap{max-width:1000px;margin:0 auto;}

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  header.top h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:0.2px;
  }
  header.top .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .clock{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    color:var(--brass-dark);
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:3px;
    white-space:nowrap;
  }

  /* employee bar */
  .emp-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .emp-chip{
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:7px 14px;
    border:1.5px solid var(--ink);
    border-radius:20px;
    background:transparent;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .12s, color .12s;
  }
  .emp-chip:hover{background:var(--paper-2);}
  .emp-chip.active{background:var(--ink);color:var(--paper);}
  .emp-chip .del{
    font-size:11px;
    opacity:.55;
    padding:0 2px;
  }
  .emp-chip .del:hover{opacity:1;color:var(--red);}
  .emp-add{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .emp-add input{
    font-family:'Sarabun',sans-serif;
    font-size:13.5px;
    padding:7px 10px;
    border:1.5px solid var(--line);
    border-radius:20px;
    background:#fff;
    width:150px;
    outline:none;
  }
  .emp-add input:focus{border-color:var(--brass);}
  .emp-add button{
    font-family:'Sarabun',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border:1.5px solid var(--brass-dark);
    border-radius:20px;
    background:var(--brass);
    color:#fff;
    cursor:pointer;
  }
  .emp-add button:hover{background:var(--brass-dark);}

  .empty-note{
    font-size:14px;
    color:var(--ink-soft);
    background:var(--paper-2);
    border:1px dashed var(--line);
    padding:20px;
    border-radius:6px;
    text-align:center;
  }

  /* week nav */
  .week-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:6px 0 14px;
  }
  .week-nav .range{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
  }
  .week-nav button{
    font-family:'Sarabun',sans-serif;
    font-size:13px;
    padding:6px 12px;
    border:1px solid var(--ink);
    background:#fff;
    border-radius:4px;
    cursor:pointer;
  }
  .week-nav button:hover{background:var(--paper-2);}
  .week-nav .nav-group{display:flex;gap:6px;}

  /* table */
  .grid-wrap{
    overflow-x:auto;
    border:1px solid var(--ink);
    border-radius:6px;
  }
  table.sched{
    border-collapse:collapse;
    width:100%;
    min-width:640px;
    background:#fff;
  }
  table.sched th, table.sched td{
    border:1px solid var(--line);
  }
  table.sched thead th{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    background:var(--ink);
    color:var(--paper);
    padding:10px 6px;
    text-align:center;
    position:sticky;
    top:0;
  }
  table.sched thead th .d{
    font-size:11px;
    font-weight:400;
    opacity:.75;
    display:block;
    margin-top:2px;
  }
  table.sched th.hourcol{
    width:78px;
    background:var(--paper-2);
    color:var(--ink);
  }
  td.hour-label{
    font-family:'Space Grotesk',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--brass-dark);
    background:var(--paper-2);
    text-align:center;
    white-space:nowrap;
    padding:8px 4px;
  }
  td.cell{
    padding:0;
    vertical-align:top;
    height:56px;
    cursor:pointer;
    position:relative;
  }
  td.cell:hover{filter:brightness(0.97);}
  td.cell .content{
    font-size:13px;
    font-weight:600;
    line-height:1.4;
    padding:9px 9px;
    white-space:pre-wrap;
    word-break:break-word;
    height:100%;
  }
  td.cell.block{border-width:1.5px;}
  td.cell.now{box-shadow:inset 0 0 0 2px var(--teal);}
  td.cell textarea{
    width:100%;
    height:100%;
    min-height:56px;
    border:none;
    outline:2px solid var(--brass);
    outline-offset:-2px;
    resize:none;
    font-family:'Sarabun',sans-serif;
    font-size:12.5px;
    padding:7px 8px;
    background:#fff;
  }
  td.cell .placeholder{
    color:var(--ink-soft);
    opacity:.3;
    font-size:16px;
    text-align:center;
    padding-top:16px;
  }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--red);}

  .legend{
    margin-top:14px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:2px;display:inline-block;}

  @media (max-width:560px){
    header.top h1{font-size:21px;}
    .emp-add input{width:110px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>ตารางเวลาเข้างาน</h1>
      <div class="sub">อังคาร–ศุกร์ 10:00–20:00 น.</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="emp-bar" id="empBar"></div>

  <div id="mainArea"></div>

  <div class="legend">
    <span><i style="background:var(--teal-light);box-shadow:inset 0 0 0 1.5px var(--teal)"></i>ชั่วโมงปัจจุบัน</span>
    <span>แต่ละวิชา/งานมีสีของตัวเอง · ลงงานเดียวกันในชั่วโมงติดกันจะรวมเป็นแท่งเดียวอัตโนมัติ</span>
    <span>คลิกที่ช่องเพื่อเพิ่ม/แก้ไขงาน · ข้อมูลนี้แชร์ให้ทุกคนในทีมเห็นร่วมกัน</span>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = [
  {key:'tue', label:'อังคาร', offset:0},
  {key:'wed', label:'พุธ', offset:1},
  {key:'thu', label:'พฤหัสบดี', offset:2},
  {key:'fri', label:'ศุกร์', offset:3}
];
const HOURS = [];
for(let h=10; h<20; h++){ HOURS.push(h); }

let employees = [];
let currentEmployeeId = null;
let weekStart = getTuesdayOfWeek(new Date());
let scheduleCache = {};
let loading = true;

function getTuesdayOfWeek(d){
  const date = new Date(d);
  const day = date.getDay();
  let diff = day - 2;
  if(diff < 0) diff += 7;
  date.setDate(date.getDate() - diff);
  date.setHours(0,0,0,0);
  return date;
}
function isoDate(d){
  return d.toISOString().slice(0,10);
}
function addDays(d, n){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+n);
  return nd;
}
function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9ก-๙]+/g,'-').replace(/^-+|-+$/g,'') || ('emp-' + Date.now());
}
function fmtRange(){
  const start = weekStart;
  const end = addDays(weekStart, 3);
  const opts = {day:'numeric', month:'short'};
  return start.toLocaleDateString('th-TH', opts) + ' – ' + end.toLocaleDateString('th-TH', opts) + ' ' + (end.getFullYear()+543);
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{ t.className = 'toast'; }, 2200);
}

function tickClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const nowCells = document.querySelectorAll('td.cell.now');
  nowCells.forEach(c=>c.classList.remove('now'));
  markCurrentHourCell();
}
setInterval(tickClock, 1000);

function markCurrentHourCell(){
  const now = new Date();
  const day = now.getDay();
  const dayIdx = DAYS.findIndex(d => (d.offset+2) === day);
  if(dayIdx === -1) return;
  const thisTue = getTuesdayOfWeek(now);
  if(isoDate(thisTue) !== isoDate(weekStart)) return;
  const hour = now.getHours();
  if(hour < 10 || hour >= 20) return;
  const cell = document.querySelector(`td.cell[data-day="${dayIdx}"][data-hour="${hour}"]`);
  if(cell) cell.classList.add('now');
}

async function loadEmployees(){
  try{
    const res = await window.storage.get('employees', true);
    employees = res ? JSON.parse(res.value) : [];
  }catch(e){
    employees = [];
  }
}
async function saveEmployees(){
  try{
    await window.storage.set('employees', JSON.stringify(employees), true);
  }catch(e){
    showToast('บันทึกรายชื่อไม่สำเร็จ ลองใหม่อีกครั้ง', true);
  }
}

async function loadSchedule(empId, weekIso){
  const cacheKey = empId + '|' + weekIso;
  if(scheduleCache[cacheKey]) return scheduleCache[cacheKey];
  try{
    const res = await window.storage.get('sched:' + empId + ':' + weekIso, true);
    const data = res ? JSON.parse(res.value) : {};
    scheduleCache[cacheKey] = data;
    return data;
  }catch(e){
    scheduleCache[cacheKey] = {};
    return {};
  }
}
async function saveSchedule(empId, weekIso, data){
  const cacheKey = empId + '|' + weekIso;
  scheduleCache[cacheKey] = data;
  try{
    await window.storage.set('sched:' + empId + ':' + weekIso, JSON.stringify(data), true);
    return true;
  }catch(e){
    showToast('บันทึกงานไม่สำเร็จ ลองใหม่อีกครั้ง', true);
    return false;
  }
}

function renderEmpBar(){
  const bar = document.getElementById('empBar');
  bar.innerHTML = '';
  employees.forEach(emp=>{
    const chip = document.createElement('button');
    chip.className = 'emp-chip' + (emp.id === currentEmployeeId ? ' active' : '');
    chip.innerHTML = '<span>' + escapeHtml(emp.name) + '</span><span class="del" title="ลบชื่อนี้">&times;</span>';
    chip.querySelector('span:first-child').onclick = () => { currentEmployeeId = emp.id; render(); };
    chip.querySelector('.del').onclick = async (ev) => {
      ev.stopPropagation();
      if(!confirm('ลบ "' + emp.name + '" ออกจากรายชื่อ? (ประวัติงานเดิมจะยังเก็บไว้)')) return;
      employees = employees.filter(e=>e.id!==emp.id);
      await saveEmployees();
      if(currentEmployeeId === emp.id){
        currentEmployeeId = employees.length ? employees[0].id : null;
      }
      render();
    };
    bar.appendChild(chip);
  });

  const addWrap = document.createElement('div');
  addWrap.className = 'emp-add';
  addWrap.innerHTML = '<input type="text" id="newEmpName" placeholder="ชื่อพนักงาน" maxlength="40"><button id="addEmpBtn">+ เพิ่มชื่อ</button>';
  bar.appendChild(addWrap);

  document.getElementById('addEmpBtn').onclick = addEmployee;
  document.getElementById('newEmpName').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') addEmployee();
  });
}

async function addEmployee(){
  const input = document.getElementById('newEmpName');
  const name = input.value.trim();
  if(!name){ showToast('พิมพ์ชื่อก่อนนะ', true); return; }
  const id = slugify(name) + '-' + Math.random().toString(36).slice(2,6);
  employees.push({id, name});
  input.value = '';
  await saveEmployees();
  currentEmployeeId = id;
  render();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function renderMain(){
  const main = document.getElementById('mainArea');
  if(!employees.length){
    main.innerHTML = '<div class="empty-note">ยังไม่มีรายชื่อพนักงาน — เพิ่มชื่อด้านบนเพื่อเริ่มลงตารางเวลา</div>';
    return;
  }
  if(!currentEmployeeId){
    currentEmployeeId = employees[0].id;
  }
  const emp = employees.find(e=>e.id===currentEmployeeId);
  if(!emp){ currentEmployeeId = employees[0].id; return renderMain(); }

  const weekIso = isoDate(weekStart);
  main.innerHTML = `
    <div class="week-nav">
      <button id="prevWeek">&larr; สัปดาห์ก่อน</button>
      <div class="range">${escapeHtml(emp.name)} · ${fmtRange()}</div>
      <div class="nav-group">
        <button id="thisWeek">สัปดาห์นี้</button>
        <button id="nextWeek">สัปดาห์ถัดไป &rarr;</button>
      </div>
    </div>
    <div class="grid-wrap"><table class="sched" id="schedTable"></table></div>
  `;
  document.getElementById('prevWeek').onclick = ()=>{ weekStart = addDays(weekStart,-7); renderMain(); };
  document.getElementById('nextWeek').onclick = ()=>{ weekStart = addDays(weekStart,7); renderMain(); };
  document.getElementById('thisWeek').onclick = ()=>{ weekStart = getTuesdayOfWeek(new Date()); renderMain(); };

  const data = await loadSchedule(currentEmployeeId, weekIso);
  buildTable(data, weekIso);
  markCurrentHourCell();
}

const PALETTE = [
  {bg:'#E4EFEC', border:'#2F6F62', text:'#1F4A40'},
  {bg:'#FBEDD9', border:'#B8823D', text:'#7A5220'},
  {bg:'#F7E4DE', border:'#C0603F', text:'#7A3A26'},
  {bg:'#E1EBF6', border:'#3E6FA6', text:'#204569'},
  {bg:'#EFE3EE', border:'#8A4E86', text:'#5A3257'},
  {bg:'#EEF0DA', border:'#7C8A3E', text:'#4F5827'},
  {bg:'#F6E1E7', border:'#B3506E', text:'#712F44'},
  {bg:'#E4E7EA', border:'#556270', text:'#333C46'},
  {bg:'#F5EBC9', border:'#A98A2A', text:'#6B571A'},
  {bg:'#E1EEE4', border:'#4E8A63', text:'#2E5940'}
];
function assignColor(text){
  let sum = 0;
  for(let i=0;i<text.length;i++){ sum = (sum + text.charCodeAt(i) * (i+1)) % 97; }
  return PALETTE[sum % PALETTE.length];
}

function computeDayGroups(data){
  // for each day, mark each hour index as: null (empty, own cell), 'skip' (covered by rowspan above), or {span, text} (block start)
  return DAYS.map((d)=>{
    const col = new Array(HOURS.length).fill(null);
    let h = 0;
    while(h < HOURS.length){
      const key = d.key + '-' + HOURS[h];
      const text = (data[key] || '').trim();
      if(!text){ h++; continue; }
      let span = 1;
      while(h + span < HOURS.length){
        const nextKey = d.key + '-' + HOURS[h + span];
        const nextText = (data[nextKey] || '').trim();
        if(nextText === text){ span++; } else break;
      }
      col[h] = {span, text};
      for(let s = 1; s < span; s++){ col[h + s] = 'skip'; }
      h += span;
    }
    return col;
  });
}

function buildTable(data, weekIso){
  const table = document.getElementById('schedTable');
  if(!table) return;
  let thead = '<thead><tr><th class="hourcol">เวลา</th>';
  DAYS.forEach((d)=>{
    const date = addDays(weekStart, d.offset);
    thead += `<th>${d.label}<span class="d">${date.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}</span></th>`;
  });
  thead += '</tr></thead>';

  const dayGroups = computeDayGroups(data);

  let tbody = '<tbody>';
  HOURS.forEach((h, hIdx)=>{
    tbody += `<tr><td class="hour-label">${h}:00–${h+1}:00</td>`;
    DAYS.forEach((d, dayIdx)=>{
      const entry = dayGroups[dayIdx][hIdx];
      if(entry === 'skip') return;
      if(entry === null){
        tbody += `<td class="cell" data-day="${dayIdx}" data-hour="${h}" data-span="1">
          <div class="content"><span class="placeholder">+</span></div>
        </td>`;
      } else {
        const c = assignColor(entry.text);
        tbody += `<td class="cell block" rowspan="${entry.span}" data-day="${dayIdx}" data-hour="${h}" data-span="${entry.span}"
          style="background:${c.bg};border-color:${c.border};">
          <div class="content" style="color:${c.text};">${escapeHtml(entry.text)}</div>
        </td>`;
      }
    });
    tbody += '</tr>';
  });
  tbody += '</tbody>';
  table.innerHTML = thead + tbody;

  table.querySelectorAll('td.cell').forEach(td=>{
    td.addEventListener('click', ()=> openEditor(td, data, weekIso));
  });
}

function openEditor(td, data, weekIso){
  if(td.querySelector('textarea')) return;
  const dayIdx = parseInt(td.getAttribute('data-day'), 10);
  const startHour = parseInt(td.getAttribute('data-hour'), 10);
  const span = parseInt(td.getAttribute('data-span'), 10) || 1;
  const dayKey = DAYS[dayIdx].key;
  const startHIdx = HOURS.indexOf(startHour);
  const coveredHours = HOURS.slice(startHIdx, startHIdx + span);
  const current = (data[dayKey + '-' + startHour] || '').trim();

  td.innerHTML = '';
  td.removeAttribute('style');
  const ta = document.createElement('textarea');
  ta.value = current;
  ta.placeholder = 'พิมพ์งานที่ทำ...';
  td.appendChild(ta);
  ta.focus();
  ta.selectionStart = ta.value.length;

  let done = false;
  const commit = async ()=>{
    if(done) return;
    done = true;
    const val = ta.value.trim();
    coveredHours.forEach(h=>{
      const key = dayKey + '-' + h;
      if(val){ data[key] = val; } else { delete data[key]; }
    });
    const ok = await saveSchedule(currentEmployeeId, weekIso, data);
    buildTable(data, weekIso);
    markCurrentHourCell();
    if(ok) showToast('บันทึกแล้ว');
  };
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ta.blur(); }
    if(e.key === 'Escape'){ ta.value = current; ta.blur(); }
  });
}

async function render(){
  renderEmpBar();
  await renderMain();
}

(async function init(){
  document.getElementById('mainArea').innerHTML = '<div class="empty-note">กำลังโหลดข้อมูล...</div>';
  await loadEmployees();
  if(employees.length) currentEmployeeId = employees[0].id;
  await render();
  tickClock();
})();
</script>
</body>
</html>
